name: release

# A v<semver> tag publishes the image, the chart and the OCM component, all
# with the tag's version without the v.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/contrib-eventing
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Push the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          owner=${GITHUB_REPOSITORY_OWNER,,}
          helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          # The image this release pushed, also on a fork. Its tag defaults to appVersion.
          sed -i "s|^  repository: .*|  repository: ghcr.io/$owner/contrib-eventing|" charts/eventing/values.yaml
          grep -qx "  repository: ghcr.io/$owner/contrib-eventing" charts/eventing/values.yaml
          helm package charts/eventing --version "$version" --app-version "$version"
          helm push "eventing-$version.tgz" "oci://ghcr.io/$owner/contrib-eventing/charts"

  ocm:
    runs-on: ubuntu-latest
    # The component references the pushed image by digest.
    needs: image
    permissions:
      contents: read
      packages: write
    env:
      OCM_VERSION: 0.54.0
      OCM_SHA256: ec48f9fc42eb4ee6c8415435ca62bf72dcf8c790f4399ce5111f6488f42379b2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the ocm CLI
        run: |
          curl -sSfL -o ocm.tgz "https://github.com/open-component-model/ocm/releases/download/v$OCM_VERSION/ocm-$OCM_VERSION-linux-amd64.tar.gz"
          echo "$OCM_SHA256  ocm.tgz" | sha256sum -c
          tar -xzf ocm.tgz ocm
          sudo install -m 0755 ocm /usr/local/bin/ocm
      - name: Push the component
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          owner=${GITHUB_REPOSITORY_OWNER,,}
          cat >"$HOME/.ocmconfig" <<YAML
          type: generic.config.ocm.software/v1
          configurations:
            - type: credentials.config.ocm.software
              consumers:
                - identity: {type: OCIRegistry, scheme: https, hostname: ghcr.io, pathprefix: $owner}
                  credentials:
                    - type: Credentials
                      properties: {username: $GITHUB_ACTOR, password: $GITHUB_TOKEN}
          YAML
          hack/ocm-component.sh "$version" "ghcr.io/$owner/contrib-eventing:$version" ctf
          ocm transfer ctf --overwrite ctf "ghcr.io/$owner"
