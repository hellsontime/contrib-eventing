# Applied into root:orgs. Lets organization workspaces bind the eventing API.
apiVersion: core.platform-mesh.io/v1alpha1
kind: APIExportPolicy
metadata:
  name: eventing.platform-mesh.io
spec:
  apiExportRef:
    name: eventing.platform-mesh.io
    clusterPath: root:providers:eventing
  allowPathExpressions:
    - :root:orgs:*
