{{- $components := list "subscription-controller" "openfga-adapter" "ingress" }}
{{- if .Values.keycloak.readerSecret }}{{ $components = append $components "keycloak-adapter" }}{{ end }}
{{- range $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eventing.name" (dict "ctx" $ "component" .) }}
  labels:
    {{- include "eventing.labels" (dict "ctx" $ "component" .) | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
