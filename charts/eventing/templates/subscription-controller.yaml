{{- $c := dict "ctx" . "component" "subscription-controller" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventing.name" $c }}
  labels:
    {{- include "eventing.labels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "eventing.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eventing.selectorLabels" $c | nindent 8 }}
    spec:
      serviceAccountName: {{ include "eventing.name" $c }}
      {{- include "eventing.podSpec" . | nindent 6 }}
      # Puts the eventing API into the provider workspace before the controller
      # watches it. Safe to run on every start.
      initContainers:
        - name: kcp-setup
          image: {{ include "eventing.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [kcp-setup, --kcp-kubeconfig=/kcp/{{ .Values.kcp.kubeconfigKey }}]
          volumeMounts:
            - {name: kcp, mountPath: /kcp, readOnly: true}
          securityContext:
            {{- include "eventing.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: controller
          image: {{ include "eventing.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - subscription-controller
            - --kcp-kubeconfig=/kcp/{{ .Values.kcp.kubeconfigKey }}
            - --apiexport-endpointslice={{ .Values.kcp.apiExportEndpointSlice }}
            - --allowed-sink-hosts={{ join "," .Values.allowedSinkHosts }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          readinessProbe:
            httpGet: {path: /readyz, port: 8090}
          volumeMounts:
            - {name: kcp, mountPath: /kcp, readOnly: true}
          securityContext:
            {{- include "eventing.containerSecurityContext" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: kcp
          secret: {secretName: {{ .Values.kcp.kubeconfigSecret }}}
