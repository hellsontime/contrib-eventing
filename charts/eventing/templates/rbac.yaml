{{- $controller := include "eventing.name" (dict "ctx" . "component" "subscription-controller") }}
# The controller manages the one Broker and a Trigger per Subscription.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $controller }}
  labels:
    {{- include "eventing.labels" (dict "ctx" . "component" "subscription-controller") | nindent 4 }}
rules:
  - apiGroups: [eventing.knative.dev]
    resources: [brokers, triggers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $controller }}
  labels:
    {{- include "eventing.labels" (dict "ctx" . "component" "subscription-controller") | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $controller }}}
subjects:
  - {kind: ServiceAccount, name: {{ $controller }}, namespace: {{ .Release.Namespace }}}
{{- $adapters := list "openfga-adapter" }}
{{- if .Values.keycloak.readerSecret }}{{ $adapters = append $adapters "keycloak-adapter" }}{{ end }}
{{- range $adapters }}
{{- $name := include "eventing.name" (dict "ctx" $ "component" .) }}
---
# The adapter keeps its place in a ConfigMap. Create can't be limited by name.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "eventing.labels" (dict "ctx" $ "component" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [eventing-{{ . }}-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "eventing.labels" (dict "ctx" $ "component" .) | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ $.Release.Namespace }}}
{{- end }}
---
# The ingress checks publishers' tokens with TokenReviews.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ include "eventing.name" (dict "ctx" . "component" "ingress") }}-auth-delegator
  labels:
    {{- include "eventing.labels" (dict "ctx" . "component" "ingress") | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "system:auth-delegator"}
subjects:
  - {kind: ServiceAccount, name: {{ include "eventing.name" (dict "ctx" . "component" "ingress") }}, namespace: {{ .Release.Namespace }}}
